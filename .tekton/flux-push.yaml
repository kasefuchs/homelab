apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: flux-push-artifact
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[*]"
    pipelinesascode.tekton.dev/on-path-change: "[.tekton/flux-push.yaml, flux/***]"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
spec:
  params:
    - name: image_name
      value: codeberg.org/kasefuchs/homelab/flux
  taskRunTemplate:
    podTemplate:
      securityContext:
        fsGroup: 65532
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: dockerconfig
      secret:
        secretName: container-registry-credentials
  pipelineSpec:
    params:
      - name: image_name
        type: string
    workspaces:
      - name: source
      - name: basic-auth
      - name: dockerconfig
    tasks:
      - name: fetch-repository
        taskRef:
          resolver: hub
          params:
            - name: catalog
              value: git-clone
            - name: name
              value: git-clone
            - name: version
              value: "1.7.1"
        workspaces:
          - name: output
            workspace: source
          - name: basic-auth
            workspace: basic-auth
        params:
          - name: url
            value: "{{ repo_url }}"
          - name: revision
            value: "{{ revision }}"
      - name: push-flux-artifact
        runAfter:
          - fetch-repository
        workspaces:
          - name: source
            workspace: source
          - name: dockerconfig
            workspace: dockerconfig
        taskSpec:
          workspaces:
            - name: source
            - name: dockerconfig
          steps:
            - name: flux-push
              image: ghcr.io/fluxcd/flux-cli:v2.10.1
              env:
                - name: DOCKER_CONFIG
                  value: $(workspaces.dockerconfig.path)
              workingDir: $(workspaces.source.path)
              script: |-
                #!/usr/bin/env sh
                set -eu

                branch="{{ target_branch }}"
                tag=$(printf '%s' "$branch" | sed 's#[^a-zA-Z0-9._-]#-#g')

                flux push artifact "oci://$(params.image_name):${tag}" \
                  --path="." \
                  --ignore-paths=/* \
                  --ignore-paths=!/flux/** \
                  --source="{{ repo_url }}" \
                  --revision="${branch}@sha1:{{ revision }}"

                if [ "$branch" = "main" ]; then
                  flux tag artifact "oci://$(params.image_name):${tag}" --tag latest
                fi
