k3s_server_config:
  token: "{{ k3s_agent_config_token }}"
  disable:
    - traefik
    - servicelb
    - local-storage
    - metrics-server
  node-taint:
    - node-role.kubernetes.io/control-plane=true:NoSchedule
  cluster-init: true
  disable-kube-proxy: true
  disable-network-policy: true
  flannel-backend: none
  node-ip: 10.45.240.16,fd45:45:45:f0::16
  node-external-ip: "{{ ansible_facts.default_ipv4.address }}"
  advertise-address: 10.45.240.16
k3s_server_config_manifests:
  coredns-custom:
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: coredns-custom
      namespace: kube-system
    data:
      docker.server: |
        docker:53 {
          errors
          cache 30
          hosts {
            {{ ansible_facts.default_ipv4.gateway }} docker
            fallthrough
          }
        }
