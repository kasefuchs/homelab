amneziawg_config_interface_host:
  Address: 10.45.16.24/24, fd45:45:45:10::24/64
  ListenPort: 48761
  PrivateKey: "{{ amneziawg_config_private_key }}"
amneziawg_config_hook_post_up_forward:
  - iptables -I FORWARD 1 -i awg0 -o ens3 -s 10.45.0.0/16 -j ACCEPT
  - iptables -I FORWARD 1 -i ens3 -o awg0 -d 10.45.0.0/16 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
  - iptables -t nat -I POSTROUTING 1 -s 10.45.0.0/16 -o ens3 -j MASQUERADE
amneziawg_config_hook_pre_down_forward:
  - iptables -D FORWARD -i awg0 -o ens3 -s 10.45.0.0/16 -j ACCEPT
  - iptables -D FORWARD -i ens3 -o awg0 -d 10.45.0.0/16 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
  - iptables -t nat -D POSTROUTING -s 10.45.0.0/16 -o ens3 -j MASQUERADE
amneziawg_config_peers:
  # silky
  - PublicKey: "{{ amneziawg_config_public_keys.silky }}"
    PresharedKey: "{{ amneziawg_config_preshared_keys.silky }}"
    AllowedIPs: 10.45.16.20/32, fd45:45:45:10::20/128
    Endpoint: silky.kasefuchs.net:48764
  # mala
  - PublicKey: "{{ amneziawg_config_public_keys.mala }}"
    PresharedKey: "{{ amneziawg_config_preshared_keys.mala }}"
    AllowedIPs: 10.45.32.16/32, fd45:45:45:20::16/128
    Endpoint: mala.kasefuchs.net:48248
  # esmae + lestat
  - PublicKey: "{{ amneziawg_config_public_keys.esmae }}"
    PresharedKey: "{{ amneziawg_config_preshared_keys.esmae }}"
    AllowedIPs: 10.45.224.24/32, fd45:45:45:e0::24/128, 10.45.16.16/32, fd45:45:45:10::16/128
