kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: homelab
nodes:
  - role: control-plane
    extraMounts:
      - &containerd-certs-mount
        hostPath: rootfs/etc/containerd/certs.d
        containerPath: /etc/containerd/certs.d
        readOnly: true
  - role: worker
    labels:
      garage.rajsingh.info/node-local-pool: tmp-10gi
    extraMounts:
      - *containerd-certs-mount
networking:
  ipFamily: dual
  kubeProxyMode: none
  disableDefaultCNI: true
