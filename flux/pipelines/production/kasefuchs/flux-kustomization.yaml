apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kasefuchs-ci
  namespace: flux-system
spec:
  path: pipelines/production/kasefuchs/config
  wait: true
  prune: true
  timeout: 5m
  interval: 1h
  retryInterval: 2m
  targetNamespace: kasefuchs-ci
  sourceRef:
    kind: OCIRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
