apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: ${NAME}-db
spec:
  retentionPolicy: 7d
  configuration:
    destinationPath: s3://plugin-barman-cloud/${NAMESPACE}/${NAME}-db/
    endpointURL: http://garage.garage-system:3900
    s3Credentials:
      accessKeyId:
        name: ${NAME}-db-barman-garage-key
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: ${NAME}-db-barman-garage-key
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: zstd
    data:
      compression: lz4
