apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: ${NAME}-garage-key
spec:
  clusterRef:
    name: garage
    namespace: garage-operator-system
  secretTemplate:
    includeBucketName: true
    accessKeyIdKey: accessKeyID
    secretAccessKeyKey: secretAccessKey
  bucketPermissions:
    - read: true
      write: true
      bucketRef:
        name: ${NAME}-garage-bucket
