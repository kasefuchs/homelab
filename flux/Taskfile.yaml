version: 3
vars:
  SOURCE:
    sh: git config --get remote.origin.url
  BRANCH:
    sh: git rev-parse --abbrev-ref HEAD
  REVISION:
    sh: git rev-parse HEAD
tasks:
  push: flux push artifact oci://localhost:5000/homelab/flux --path=. --source="{{.SOURCE}}" --revision="{{.BRANCH}}@sha1:{{.REVISION}}"
  reconcile: flux reconcile source oci flux-system
