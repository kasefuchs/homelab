# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/fluxcd.controlplane.io/fluxinstance_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
spec:
  distribution:
    # renovate: datasource=github-releases depName=fluxcd/flux2
    version: 2.9.4
    registry: ghcr.io/fluxcd
  cluster:
    size: small
    networkPolicy: false
  sync:
    kind: OCIRepository
    url: oci://registry:5000/homelab/flux
    ref: latest
    path: clusters/kind
    interval: 1m
  kustomize:
    patches:
      - # language="yaml"
        patch: |-
          - op: add
            path: /spec/insecure
            value: true
        target:
          kind: OCIRepository
