apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-s3
spec:
  hostnames:
    - s3.garage.kasefuchs.net
    - "*.s3.garage.kasefuchs.net"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-web
spec:
  hostnames:
    - "*.web.garage.kasefuchs.net"
