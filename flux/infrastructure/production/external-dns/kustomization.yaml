apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/external-dns
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: external-dns-controller
    patch: |-
      - op: replace
        path: /spec/path
        value: infrastructure/production/external-dns/controller
