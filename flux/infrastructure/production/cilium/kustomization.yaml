apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/cilium
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: cilium-controller
    patch: |-
      - op: replace
        path: /spec/path
        value: infrastructure/production/cilium/controller
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: cilium-config
    patch: |-
      - op: replace
        path: /spec/path
        value: infrastructure/production/cilium/config
