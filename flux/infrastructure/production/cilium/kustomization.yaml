apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/cilium
patches:
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: cilium-controller
        namespace: flux-system
      spec:
        path: infrastructure/production/cilium/controller
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: cilium-config
        namespace: flux-system
      spec:
        path: infrastructure/production/cilium/config
