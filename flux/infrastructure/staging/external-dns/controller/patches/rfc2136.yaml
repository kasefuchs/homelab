apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  values:
    provider:
      name: rfc2136
    extraArgs:
      - --rfc2136-host=docker
      - --rfc2136-port=10053
      - --rfc2136-zone=staging.homelab.test
      - --rfc2136-insecure
      - --rfc2136-tsig-axfr
