apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage-operator-controller
  namespace: flux-system
spec:
  path: infrastructure/base/garage-operator/controller
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: garage-operator-system
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: cert-manager-controller
    - name: prometheus-operator-crd
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage-operator-config
  namespace: flux-system
spec:
  path: infrastructure/base/garage-operator/config
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: garage-operator-system
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: garage-operator-controller
    - name: openebs-controller
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage-operator-backup
  namespace: flux-system
spec:
  path: infrastructure/base/garage-operator/backup
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: garage-operator-system
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: garage-operator-config
  decryption:
    provider: sops
    secretRef:
      name: sops-age
