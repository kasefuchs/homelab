apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-controller
  namespace: flux-system
spec:
  path: infrastructure/base/cloudnative-pg/controller
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: cnpg-system
  sourceRef:
    kind: OCIRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-plugin-barman-cloud
  namespace: flux-system
spec:
  path: infrastructure/base/cloudnative-pg/plugin-barman-cloud
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: cnpg-system
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: cloudnative-pg-controller
  decryption:
    provider: sops
    secretRef:
      name: sops-age
