apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-controller
  namespace: flux-system
spec:
  path: infrastructure/base/cert-manager/controller
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: cert-manager
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: prometheus-operator-crd
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  path: infrastructure/base/cert-manager/config
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: cert-manager
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: cert-manager-controller
  decryption:
    provider: sops
    secretRef:
      name: sops-age
