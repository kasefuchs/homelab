apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kopiur-ui-external
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: internal
      namespace: gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: external-kopia-ui
          port: 51515
