apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  interval: 1h
  releaseName: metrics-server
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: metrics-server
  values:
    args:
      - --logging-format=json
      - --kubelet-insecure-tls
    apiService:
      insecureSkipTLSVerify: false
    tls:
      type: cert-manager
