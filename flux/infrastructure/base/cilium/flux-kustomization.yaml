apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-controller
  namespace: flux-system
spec:
  path: infrastructure/base/cilium/controller
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: kube-system
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: gateway-api-crd
    - name: prometheus-operator-crd
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-config
  namespace: flux-system
spec:
  path: infrastructure/base/cilium/config
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: kube-system
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: cilium-controller
  decryption:
    provider: sops
    secretRef:
      name: sops-age
