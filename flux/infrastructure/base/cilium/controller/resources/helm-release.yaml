apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h
  releaseName: cilium
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: cilium
  values:
    devices:
      - eth+
      - enp+
      - ens+
    hubble:
      ui:
        enabled: true
        # not merged yet, but why not?
        # https://github.com/cilium/cilium/pull/46792
        httpRoute:
          enabled: true
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: ListenerSet
              name: internal
              namespace: gateway-system
      relay:
        enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - icmp
          - http
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
    nodeIPAM:
      enabled: true
    gatewayAPI:
      enabled: true
      gatewayClass:
        create: false
    ipv6:
      enabled: true
    l2announcements:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: true
    operator:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      dashboards:
        enabled: true
    defaultLBServiceIPAM: none
    kubeProxyReplacement: true
