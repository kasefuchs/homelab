# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-snapshot-crd
spec:
  path: client/config/crd
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: csi-snapshot
