apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  profile: all
  targetNamespace: tekton-system
  chain:
    disabled: true
  result:
    disabled: true
  trigger:
    disabled: true
  dashboard:
    readonly: false
  platforms:
    kubernetes:
      pipelinesAsCode:
        enable: true
  pipeline:
    disable-creds-init: true
    set-security-context: true
