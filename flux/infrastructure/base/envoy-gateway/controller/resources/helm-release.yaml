apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  releaseName: envoy-gateway
  install:
    crds: Skip
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    crds: Skip
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  values:
    crds:
      enabled: false
