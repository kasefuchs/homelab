apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: pocket-id-garage-key
spec:
  clusterRef:
    name: garage
    namespace: garage-system
  secretTemplate:
    includeBucketName: true
    accessKeyIdKey: accessKeyID
    secretAccessKeyKey: secretAccessKey
  bucketPermissions:
    - bucketRef:
        name: pocket-id-garage-bucket
      read: true
      write: true
