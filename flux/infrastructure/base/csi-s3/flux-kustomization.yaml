apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-s3-controller
  namespace: flux-system
spec:
  path: infrastructure/base/csi-s3/controller
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: kube-system
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: cilium-controller
  decryption:
    provider: sops
    secretRef:
      name: sops-age
