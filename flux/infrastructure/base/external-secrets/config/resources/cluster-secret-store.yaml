apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cnpg-system
spec:
  provider:
    kubernetes:
      remoteNamespace: cnpg-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
  conditions:
    - namespaceSelector:
        matchLabels:
          external-secrets.io/store-access-cnpg-system: "true"
