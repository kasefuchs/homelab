# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs-controller
spec:
  path: infrastructure/base/openebs/controller
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: &namespace openebs-system
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: csi-snapshot-crd
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      NAME: openebs
      NAMESPACE: *namespace
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs-config
spec:
  path: infrastructure/base/openebs/config
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: &namespace openebs-system
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: openebs-controller
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      NAME: openebs
      NAMESPACE: *namespace
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
