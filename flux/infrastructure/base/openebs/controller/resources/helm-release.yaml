apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  interval: 1h
  releaseName: openebs
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: openebs
  values:
    loki:
      enabled: false
    alloy:
      enabled: false
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
        rawfile:
          enabled: true
        hostpath:
          enabled: true
      replicated:
        mayastor:
          enabled: false
    lvm-localpv:
      enabled: false
    zfs-localpv:
      enabled: false
    localpv-provisioner:
      enabled: true
      hostpathClass:
        enabled: true
        nodeDeployment: true
        isDefaultClass: false
    rawfile-localpv:
      enabled: true
      controller:
        tolerations: []
      capabilities:
        resize:
          enabled: true
        snapshots:
          enabled: true
      storageClasses:
        - name: rawfile-localpv
          enabled: true
          isDefault: true
          allowVolumeExpansion: true
          reclaimPolicy: Delete
          thinProvision: "true"
          fsType: ext4
          formatOptions:
            - "-m"
            - "0"
