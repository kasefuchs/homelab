apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rawfile-localpv
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rawfile.csi.openebs.io
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
mountOptions:
  - noatime
parameters:
  formatOptions: "-m 0"
  thinProvision: "true"
