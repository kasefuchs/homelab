apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage
spec:
  replication:
    factor: 3
  storage:
    replicas: 3
    data:
      size: 100Gi
    metadata:
      size: 10Gi
  webApi:
    rootDomain: .web.garage.example.com
  admin:
    adminTokenSecretRef:
      name: garage-secret
      key: admin-token
  network:
    rpcSecretRef:
      name: garage-secret
      key: rpc-secret
