apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: pocket-id-garage
spec:
  repository:
    kind: ClusterRepository
    name: external
  credentialProjection:
    enabled: true
  copyMethod: Direct
  sources:
    - pvc:
        name: pocket-id-garage
  retention:
    keepLatest: 3
    keepDaily: 7
    keepWeekly: 2
  compression:
    compressor: zstd
    neverCompress:
      - "*.jpg"
      - "*.jpeg"
      - "*.png"
      - "*.gif"
      - "*.webp"
      - "*.ico"
      - "*.mp4"
      - "*.webm"
      - "*.ogg"
      - "*.mkv"
      - "*.avi"
      - "*.mov"
      - "*.mp3"
      - "*.flac"
      - "*.xlsx"
      - "*.pptx"
      - "*.odt"
      - "*.ods"
      - "*.odp"
      - "*.odg"
      - "*.pdf"
      - "*.woff2"
      - "*.ttf"
      - "*.otf"
      - "*.rar"
      - "*.7z"
      - "*.gz"
      - "*.tgz"
