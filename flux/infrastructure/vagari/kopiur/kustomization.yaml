apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/kopiur
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: kopiur-config
    patch: |-
      - op: replace
        path: /spec/path
        value: infrastructure/vagari/kopiur/config
