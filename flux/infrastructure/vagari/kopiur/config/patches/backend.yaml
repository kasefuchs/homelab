apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: external
spec:
  backend:
    s3:
      bucket: kopiur
      endpoint: docker:9090
      tls:
        disableTls: true
      auth:
        secretRef:
          name: kopiur-secret
          namespace: kopiur-system
