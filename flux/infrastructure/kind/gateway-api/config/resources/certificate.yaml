apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kind-tls
spec:
  secretName: kind-tls-secret
  issuerRef:
    kind: ClusterIssuer
    name: internal
  dnsNames:
    - kind.homelab.test
    - "*.kind.homelab.test"
    - "*.hook.kind.homelab.test"
    - s3.garage.kind.homelab.test
    - "*.s3.garage.kind.homelab.test"
    - "*.web.garage.kind.homelab.test"
