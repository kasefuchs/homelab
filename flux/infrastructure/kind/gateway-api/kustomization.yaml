apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/gateway-api
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: gateway-api-config
    patch: |-
      - op: replace
        path: /spec/path
        value: infrastructure/kind/gateway-api/config
