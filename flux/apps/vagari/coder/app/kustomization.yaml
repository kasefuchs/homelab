apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/coder/app
components:
  - ../../../base/coder/app/components/backup
patches:
  - path: patches/route.yaml
  - path: patches/environment.yaml
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: coder
