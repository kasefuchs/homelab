apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder
spec:
  values:
    coder:
      httproute:
        enable: true
        host: coder.vagari.homelab.test
        wildcardHost: "*.coder.vagari.homelab.test"
        parentRefs:
          - name: external
            namespace: gateway-system
            sectionName: https
