apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  values:
    httpRoute:
      enabled: true
      hostnames:
        - nextcloud.kind.homelab.test
      parentRefs:
        - name: external
          namespace: gateway-system
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
