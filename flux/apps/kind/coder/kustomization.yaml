apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/coder
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: coder-app
    patch: |-
      - op: replace
        path: /spec/path
        value: apps/kind/coder/app
