apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
spec:
  values:
    ingress:
      enabled: true
      annotations:
        external-dns.alpha.kubernetes.io/target: ingress.kind.homelab.test
      hosts:
        - host: podinfo.kind.homelab.test
          paths:
            - path: /
              pathType: Prefix
