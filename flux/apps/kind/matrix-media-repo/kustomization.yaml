apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/matrix-media-repo
patches:
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: matrix-media-repo-app
        namespace: flux-system
      spec:
        path: apps/kind/matrix-media-repo/app
