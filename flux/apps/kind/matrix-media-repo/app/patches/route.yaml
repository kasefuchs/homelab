apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix-media-repo
spec:
  values:
    ingress:
      main:
        enabled: false
    route:
      main:
        enabled: true
        hostnames:
          - mtarix.kind.homelab.test
        parentRefs:
          - name: external
            namespace: gateway-system
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /_matrix/media/
              - path:
                  type: PathPrefix
                  value: /_matrix/client/v1/media/
              - path:
                  type: PathPrefix
                  value: /_matrix/federation/v1/media/
            backendRefs:
              - identifier: main
