apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: nextcloud
spec:
  repository:
    kind: ClusterRepository
    name: shared
  credentialProjection:
    enabled: true
  copyMethod: Direct
  sources:
    # pvcSelector is not fully wired in kopiur yet
    # falling back to explicit pvc name
    - pvc:
        name: nextcloud-nextcloud
  retention:
    keepLatest: 3
    keepDaily: 7
    keepWeekly: 2
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
  compression:
    compressor: zstd
    neverCompress:
      - "*.jpg"
      - "*.jpeg"
      - "*.png"
      - "*.gif"
      - "*.webp"
      - "*.ico"
      - "*.mp4"
      - "*.webm"
      - "*.ogg"
      - "*.mkv"
      - "*.avi"
      - "*.mov"
      - "*.mp3"
      - "*.flac"
      - "*.xlsx"
      - "*.pptx"
      - "*.odt"
      - "*.ods"
      - "*.odp"
      - "*.odg"
      - "*.pdf"
      - "*.woff2"
      - "*.ttf"
      - "*.otf"
      - "*.rar"
      - "*.7z"
      - "*.gz"
      - "*.tgz"
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: nextcloud-nightly
spec:
  policyRef:
    name: nextcloud
  schedule:
    cron: "H 2 * * *"
    jitter: 30m
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: nextcloud-db
spec:
  repository:
    kind: ClusterRepository
    name: shared
  credentialProjection:
    enabled: true
  copyMethod: Direct
  sources:
    # pvcSelector is not fully wired in kopiur yet
    # falling back to explicit pvc name
    - pvc:
        name: nextcloud-db-1
  retention:
    keepLatest: 3
    keepDaily: 7
    keepWeekly: 2
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
  compression:
    compressor: zstd
  hooks:
    beforeSnapshot:
      - workloadExec:
          podSelector:
            matchLabels:
              cnpg.io/cluster: nextcloud-db
              cnpg.io/instanceRole: primary
          container: postgres
          command:
            - "psql"
            - "-U"
            - "postgres"
            - "-c"
            - "SELECT pg_backup_start('kopiur');"
          timeout: 2m
    afterSnapshot:
      - workloadExec:
          podSelector:
            matchLabels:
              cnpg.io/cluster: nextcloud-db
              cnpg.io/instanceRole: primary
          container: postgres
          command:
            - "psql"
            - "-U"
            - "postgres"
            - "-c"
            - "SELECT pg_backup_stop();"
          timeout: 2m
          continueOnFailure: true
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: nextcloud-db-nightly
spec:
  policyRef:
    name: nextcloud-db
  schedule:
    cron: "H 2 * * *"
    jitter: 30m
