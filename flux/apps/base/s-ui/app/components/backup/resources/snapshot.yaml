apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: s-ui-db
spec:
  repository:
    kind: ClusterRepository
    name: external
  credentialProjection:
    enabled: true
  copyMethod: Direct
  sources:
    # pvcSelector is not fully wired in kopiur yet
    # falling back to explicit pvc name
    - pvc:
        name: s-ui-database
  retention:
    keepLatest: 3
    keepDaily: 7
    keepWeekly: 2
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
  compression:
    compressor: zstd
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: s-ui-db-nightly
spec:
  policyRef:
    name: s-ui-db
  schedule:
    cron: "H 2 * * *"
    jitter: 30m
    runOnCreate: false
