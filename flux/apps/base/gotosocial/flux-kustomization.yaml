apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gotosocial-app
  namespace: flux-system
spec:
  path: apps/base/gotosocial/app
  wait: false
  prune: true
  timeout: 5m
  interval: 1h
  retryInterval: 2m
  targetNamespace: gotosocial
  sourceRef:
    kind: OCIRepository
    name: flux-system
