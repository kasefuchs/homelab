apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: home-assistant-data
spec:
  repository:
    kind: ClusterRepository
    name: shared
  credentialProjection:
    enabled: true
  copyMethod: Direct
  sources:
    # pvcSelector is not fully wired in kopiur yet
    # falling back to explicit pvc name
    - pvc:
        name: home-assistant-config
  retention:
    keepLatest: 3
    keepDaily: 7
    keepWeekly: 2
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
  compression:
    compressor: zstd
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: home-assistant-data-nightly
spec:
  policyRef:
    name: home-assistant-data
  schedule:
    cron: "H 2 * * *"
    jitter: 30m
    runOnCreate: false
