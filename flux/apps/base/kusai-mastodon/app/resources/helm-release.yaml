apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kusai-mastodon
spec:
  interval: 1h
  releaseName: kusai-mastodon
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: kusai-mastodon
  values:
    config:
      log:
        as_json: true
