apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: matrix-media-repo-db
spec:
  repository:
    kind: ClusterRepository
    name: external
  credentialProjection:
    enabled: true
  copyMethod: Direct
  sources:
    # pvcSelector is not fully wired in kopiur yet
    # falling back to explicit pvc name
    - pvc:
        name: matrix-media-repo-db-1
  retention:
    keepLatest: 3
    keepDaily: 7
    keepWeekly: 2
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
  compression:
    compressor: zstd
  hooks:
    beforeSnapshot:
      - workloadExec:
          podSelector:
            matchLabels:
              cnpg.io/cluster: matrix-media-repo-db
              cnpg.io/instanceRole: primary
          container: postgres
          command:
            - "psql"
            - "-U"
            - "postgres"
            - "-c"
            - "SELECT pg_backup_start('kopiur');"
          timeout: 2m
    afterSnapshot:
      - workloadExec:
          podSelector:
            matchLabels:
              cnpg.io/cluster: matrix-media-repo-db
              cnpg.io/instanceRole: primary
          container: postgres
          command:
            - "psql"
            - "-U"
            - "postgres"
            - "-c"
            - "SELECT pg_backup_stop();"
          timeout: 2m
          continueOnFailure: true
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: matrix-media-repo-db-nightly
spec:
  policyRef:
    name: matrix-media-repo-db
  schedule:
    cron: "H 2 * * *"
    jitter: 30m
    runOnCreate: false
---
