apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix-media-repo
spec:
  interval: 1h
  releaseName: matrix-media-repo
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: matrix-media-repo
  values:
    persistence:
      media:
        enabled: false
    config:
      redis:
        enabled: true
        databaseNumber: 0
        shards:
          - name: main
            addr: matrix-media-repo-redis:6379
    datastores:
      file:
        forKinds: []
      garage:
        type: s3
        forKinds:
          - archives
          - thumbnails
          - local_media
          - remote_media
        opts:
          tempPath: /tmp/
          ssl: false
    route:
      main:
        enabled: true
        parentRefs:
          - name: external
            namespace: gateway-system
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /_matrix/media/
              - path:
                  type: PathPrefix
                  value: /_matrix/client/v1/media/
              - path:
                  type: PathPrefix
                  value: /_matrix/federation/v1/media/
            backendRefs:
              - identifier: main
  valuesFrom:
    - kind: Secret
      name: matrix-media-repo-db-app
      valuesKey: uri
      targetPath: config.database.postgres
    - kind: Secret
      name: matrix-media-repo-garage-key
      valuesKey: host
      targetPath: datastores.garage.opts.endpoint
    - kind: Secret
      name: matrix-media-repo-garage-key
      valuesKey: bucket
      targetPath: datastores.garage.opts.bucketName
    - kind: Secret
      name: matrix-media-repo-garage-key
      valuesKey: region
      targetPath: datastores.garage.opts.region
    - kind: Secret
      name: matrix-media-repo-garage-key
      valuesKey: accessKeyID
      targetPath: datastores.garage.opts.accessKeyId
    - kind: Secret
      name: matrix-media-repo-garage-key
      valuesKey: secretAccessKey
      targetPath: datastores.garage.opts.accessSecret
