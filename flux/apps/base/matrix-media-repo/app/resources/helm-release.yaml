apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix-media-repo
spec:
  interval: 1h
  releaseName: matrix-media-repo
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: matrix-media-repo
  values:
    persistence:
      media:
        enabled: false
    serviceMonitor:
      main:
        enabled: true
    configMaps:
      dashboard:
        enabled: true
    datastores:
      file:
        forKinds: []
      garage:
        type: s3
        forKinds:
          - archives
          - thumbnails
          - local_media
          - remote_media
        opts:
          tempPath: /tmp/
          ssl: false
    config:
      repo:
        jsonLogs: true
      accessTokens:
        maxCacheTimeSeconds: 43200
      redis:
        enabled: true
        databaseNumber: 0
        shards:
          - name: main
            addr: matrix-media-repo-redis:6379
      rateLimit:
        enabled: false
      urlPreviews:
        oEmbed: true
      thumbnails:
        types:
          - image/jpeg
          - image/jpg
          - image/png
          - image/apng
          - image/gif
          - image/heif
          - image/heic
          - image/webp
          - image/bmp
          - image/tiff
          - audio/mpeg
          - audio/ogg
          - audio/wav
          - audio/flac
    route:
      main:
        enabled: true
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: external
            namespace: gateway-system
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /_matrix/media/
              - path:
                  type: PathPrefix
                  value: /_matrix/client/v1/media/
              - path:
                  type: PathPrefix
                  value: /_matrix/federation/v1/media/
              # gently stolen from
              # https://github.com/spantaleev/matrix-docker-ansible-deploy/blob/master/roles/custom/matrix-media-repo/defaults/main.yml
              - path:
                  type: RegularExpression
                  value: ^/_matrix/client/(r0|v1|v3|unstable)/logout(/all)?$
              - path:
                  type: RegularExpression
                  value: ^/_matrix/client/(r0|v1|v3|unstable)/admin/(purge_media_cache|quarantine_media/.*)$
            backendRefs:
              - identifier: main
  valuesFrom:
    - kind: Secret
      name: matrix-media-repo-db-app
      valuesKey: uri
      targetPath: config.database.postgres
    - kind: Secret
      name: matrix-media-repo-garage-key
      valuesKey: host
      targetPath: datastores.garage.opts.endpoint
    - kind: Secret
      name: matrix-media-repo-garage-key
      valuesKey: bucket
      targetPath: datastores.garage.opts.bucketName
    - kind: Secret
      name: matrix-media-repo-garage-key
      valuesKey: region
      targetPath: datastores.garage.opts.region
    - kind: Secret
      name: matrix-media-repo-garage-key
      valuesKey: accessKeyID
      targetPath: datastores.garage.opts.accessKeyId
    - kind: Secret
      name: matrix-media-repo-garage-key
      valuesKey: secretAccessKey
      targetPath: datastores.garage.opts.accessSecret
