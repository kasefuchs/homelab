apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: matrix-media-repo-dragonfly
spec:
  replicas: 1
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
