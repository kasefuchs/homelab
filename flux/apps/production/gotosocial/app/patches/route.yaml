apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gotosocial
spec:
  values:
    route:
      main:
        enabled: true
        hostnames:
          - social.floof.fans
        parentRefs:
          - name: external
            namespace: gateway-system
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
      apex:
        enabled: true
        hostnames:
          - floof.fans
        parentRefs:
          - name: external
            namespace: gateway-system
            sectionName: https
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /.well-known/webfinger
              - path:
                  type: Exact
                  value: /.well-known/host-meta
              - path:
                  type: Exact
                  value: /.well-known/nodeinfo
