apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db
spec:
  storage:
    size: 20Gi
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: nextcloud-garage-bucket
spec:
  quotas:
    maxSize: 100Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  values:
    persistence:
      size: 15Gi
